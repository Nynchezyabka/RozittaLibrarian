# Эталонный набор вопросов — Rozitta Librarian
# Корпус: Мастер-группа по психологии (Виолетта Макеева)
#
# ─────────────────────────────────────────────────────────────
# ЧЕТЫРЕ НАБОРА В ОДНОМ ФАЙЛЕ. НЕ СМЕШИВАТЬ ПРИ ПОДСЧЁТЕ:
#   measures: retrieval → recall@k. Работает БЕЗ модели, мерить можно уже сейчас
#   measures: tools     → точное совпадение. Проверяет stats/read_post/индекс
#   measures: semantics → recall@k в конфигурациях A/B/C. Решает вопрос
#                         про эмбеддинги — это главный набор
#   measures: honesty   → зачёт за честное «в корпусе нет». Любой связный
#                         ответ = провал
#
# КОНФИГУРАЦИИ ДЛЯ СРАВНЕНИЯ:
#   A — один FTS-запрос по вопросу как есть
#   B — модель делает 3-5 переформулировок с синонимами, несколько поисков
#   C — B + эмбеддинг-реранк кандидатов
#
# ПОЛЯ:
#   expected_posts    — id постов, машинная проверка recall
#   expected_issues   — выпуски, для человеческой сверки
#   expected_files    — транскрипты, которые обязаны найтись
#   author_terms      — как это называется у автора. ВНИМАНИЕ: писалось
#                       со знанием правильных ответов, поэтому режим
#                       --query-mode oracle даёт ЗАВЫШЕННУЮ оценку (потолок)
#   naive_terms       — поисковые слова для конфигурации B.
#                       СЕЙЧАС ЗАПОЛНЕНЫ ВРУЧНУЮ человеком, видевшим корпус
#                       и правильные ответы => оценка ЗАВЫШЕНА.
#                       Для честного результата заменить ответом модели,
#                       полученным вслепую: см. слепая_проверка.md
#                       и apply_blind_terms.py
#   distractor_posts  — где слово ВСТРЕЧАЕТСЯ, но ответа НЕТ
#   checks_data       — ответ есть и в CLAUDE.md, и в данных; проверяет,
#                       полезет ли модель в данные или процитирует инструкцию
# ─────────────────────────────────────────────────────────────

meta:
  corpus: "Мастер-группа по психологии"
  created: 2026-07-28
  version: 1
  total: 23

# Общие правила зачёта для типа "personal" (сверх recall):
rubric_personal:
  - "Модель отличает позицию автора от мнений участниц и помечает это"
  - "Модель передаёт шаги автора, а не даёт советы от себя"
  - "Модель не выносит суждений о пользователе"

questions:

  # ══ Тип 1. Терминологические ═══════════════════════════════
  # Термин есть и в вопросе, и в тексте. Обязан находиться даже
  # простым префиксным FTS. Провал здесь = проблема в индексе.

  - id: q01
    type: terminological
    measures: retrieval
    question: "Что такое «молочная» и «коренная» личность и чем они отличаются?"
    expected_posts: [85]
    expected_issues: ["В02"]
    expected_files: ["В02_п085_Молочная_и_коренная_личность.md"]
    min_hits: 1
    top_k: 5

  - id: q02
    type: terminological
    measures: retrieval
    question: "Кто такой «поверженный защитник»?"
    expected_posts: [114]
    expected_issues: ["В17"]
    expected_files: ["В17_п114_Поверженный_защитник.md"]
    expected_note: "Плюс комментарии к посту 114"
    min_hits: 1
    top_k: 5

  - id: q03
    type: terminological
    measures: retrieval
    question: "Что автор называет «амортизирующим матрасиком» и зачем он нужен?"
    expected_posts: [121]
    expected_issues: ["В21"]
    expected_note: >
      Формирование чувства социальной ценности: «амортизирующий матрасик
      из накопленного опыта подтверждения собственной социальной ценности»
    min_hits: 1
    top_k: 5

  # ══ Тип 2. Тематические ════════════════════════════════════
  # Широкая тема, релевантных источников много. Важна не только
  # полнота, но и то, что выдача не тонет в бытовых упоминаниях.

  - id: q04
    type: thematic
    measures: retrieval
    question: "Как проработать болезненную реакцию на критику и обесценивание?"
    expected_posts: [119, 121, 122, 125, 127, 130, 132, 134]
    expected_issues: ["В20", "В21", "В22", "В23", "В24", "В25", "В26", "В27"]
    key_issues: ["В23", "В26"]
    expected_note: >
      Цикл «Обесценивание» В20–В27. В23 — лечение низкой социальной
      ценности, В26 — толерантность к обесцениванию и одобрению.
      Хороший ответ перечисляет НЕСКОЛЬКО выпусков, а не один.
    min_hits: 3
    top_k: 10

  - id: q05
    type: thematic
    measures: retrieval
    question: "Что в материалах говорится о зависти?"
    expected_posts: [140]
    expected_issues: ["В32"]
    expected_files: ["В32_Осуждение_высокомерие_зависть_самопрезрение"]
    expected_note: >
      Плюс комментарии к посту 140. ОТДЕЛЬНО ПРОВЕРИТЬ: выдача не должна
      утонуть в бытовых упоминаниях зависти в проработках участниц.
    min_hits: 1
    top_k: 10
    checks_precision: true

  - id: q06
    type: thematic
    measures: retrieval
    question: "Почему человек постоянно сравнивает себя с другими и как это лечится?"
    expected_posts: [145, 146, 147, 148, 149]
    expected_issues: ["В35", "В36", "В37", "В38", "В39"]
    expected_note: "Цикл «Сравнение». Хороший ответ разделяет теорию (В35) и проработку (В37)"
    min_hits: 2
    top_k: 10

  # ══ Тип 3. Навигационные ═══════════════════════════════════
  # Проверяют не поиск, а инструменты и знание структуры архива.
  # Оцениваются точным совпадением, не recall.

  - id: q07
    type: navigational
    measures: tools
    question: "В каком выпуске и посте разбирается алгоритм «унижение + агрессия»? Где лежит его транскрипт?"
    expected_posts: [109]
    expected_issues: ["В14"]
    expected_answer: "media/videos/transcripts/В14_п109_Унижение_плюс_агрессия_алгоритм.md"
    tool_expected: [search, read_post]

  - id: q08
    type: navigational
    measures: tools
    question: "Почему у постов 91 и 95 пустые файлы комментариев? Это ошибка выгрузки?"
    expected_posts: [90, 94]
    expected_answer: >
      Нет, не ошибка. Это дополнения В5д и В7д — вторые видео выпусков 5 и 7.
      Обсуждения лежат в комментариях к постам 90 и 94.
    tool_expected: [stats, read_post]
    checks_data: true
    note: "Вопрос про целостность архива, а не про содержание корпуса"

  - id: q09
    type: navigational
    measures: tools
    question: "Из каких выпусков состоит цикл «Презрение» и к каким постам они привязаны?"
    expected_posts: [138, 139, 140, 141]
    expected_issues: ["В30", "В31", "В32", "В33"]
    expected_answer: "В30→138, В31→139, В32→140, В33→141 (по 00_Индекс.md)"
    tool_expected: [list_shelves, search]

  # ══ Тип 4. Аналитические ═══════════════════════════════════
  # Чистая арифметика по базе. Из текста не отвечаются в принципе.
  # Самые дешёвые для автопроверки: сверка числа.

  - id: q10
    type: analytical
    measures: tools
    question: "Сколько ответов автора помечено тегом #ответвиолетты и с какого поста началась эта разметка?"
    expected_answer: "~1700 сообщений, начиная с поста 81"
    expected_posts: [81]
    tool_expected: [stats]
    checks_data: true
    note: "Хороший ответ ПЕРЕСЧИТЫВАЕТ по файлам/БД, а не цитирует инструкцию"

  - id: q11
    type: analytical
    measures: tools
    question: "К какому выпуску цикла «Сравнение» больше всего комментариев участников? Приведи числа по постам 145–149."
    expected_posts: [145, 146, 147, 148, 149]
    expected_answer: ""     # заполнить после подсчёта по telegram_archive.db
    tool_expected: [stats]
    note: >
      САМЫЙ ТЯЖЁЛЫЙ ВОПРОС НАБОРА. Требует реальных подсчётов по
      comments-файлам или SQL по базе. Ответ без чисел или с круглыми
      «примерно» = ПРОВАЛ по правилу корпуса «приводить числа, не впечатления».

  # ══ Тип 5. Сравнительные ═══════════════════════════════════
  # Нужно найти ДВА разных места и сопоставить. Проверяют
  # способность цикла сделать несколько поисков, а не один.

  - id: q12
    type: comparative
    measures: retrieval
    question: "Чем «травма отвержения» отличается от «травмы покинутости» в терминологии автора?"
    expected_posts: [135, 151, 152]
    expected_issues: ["В28", "В40", "В41"]
    expected_note: >
      Сопоставление В28 (пост 135) и В40–В41 (посты 151–152), с цитатами
      из ОБОИХ. Провал — подмена академическими определениями.
    min_hits: 2
    top_k: 10

  - id: q13
    type: comparative
    measures: retrieval
    question: "Чем тег #qrbase отличается от #проверкапроработки — что помечается каждым?"
    expected_terms: ["#qrbase", "#проверкапроработки"]
    expected_answer: >
      #qrbase — структурированные «Вопрос → Ответ» для обучения нейросети
      автора. #проверкапроработки — эталонные разборы проработок участниц,
      часто с чек-листом.
    min_hits: 2
    top_k: 10
    checks_data: true

  # ══ Тип 6. Личные (от первого лица) ════════════════════════
  # САМЫЕ ВАЖНЫЕ. Живая речь без единого термина автора.
  # Именно на них решается вопрос про эмбеддинги.
  # Плюс к recall действует rubric_personal (см. вверху файла).

  - id: q14
    type: personal
    measures: semantics
    question: "Мне больно, когда мои успехи никто не замечает, и я всё время жду похвалы. Что об этом есть в материалах?"
    expected_posts: [121, 122, 125, 134]
    expected_issues: ["В21", "В22", "В23", "В27"]
    author_terms:
      - "подтверждение социальной ценности"
      - "дефицит социальной ценности"
      - "одобрение"
      - "обесценивание"
    naive_terms:                # ответ модели, слепая проверка
      - "обесценивание"
      - "потребность в признании"
      - "нарциссическая рана"
      - "похвала как подкрепление"
      - "внутренний ребенок"
    expected_note: "Ответ строго по автору, с пометкой источников, БЕЗ общих психологических советов"
    min_hits: 1
    top_k: 10

  - id: q15
    type: personal
    measures: semantics
    question: "Я вспылила и накричала на ребёнка, потом мучаюсь виной. С чего мне начать по методике группы?"
    expected_posts: [102, 104, 105, 109, 110, 113, 114, 115, 118, 143]
    expected_issues: ["В11", "В12", "В13", "В14", "В15", "В16", "В17", "В18", "В19", "В34"]
    key_issues: ["В18", "В19", "В34"]
    author_terms:
      - "агрессия"
      - "крики"
      - "БОЛЬШОЙ АЛГОРИТМ"
      - "экспресс-алгоритмы"
    naive_terms:                # ответ модели, слепая проверка
      - "вина"
      - "агрессия на ребенка"
      - "стыд"
      - "восстановление контакта"
      - "ремонт отношений"
      - "материнская фигура"
    expected_note: "Проверка, что модель передаёт ШАГИ АВТОРА, а не даёт советы от себя"
    min_hits: 2
    top_k: 10

  - id: q16
    type: personal
    measures: semantics
    question: "Мне трудно отказывать: на работе все знают, что я не откажу, и грузят меня чужими задачами. Что мне с этим делать по методике группы?"
    expected_posts: [143, 149]
    expected_issues: ["В39", "В34"]
    author_terms:
      - "разочарование"
      - "перегретое ожидание"
      - "блок отказывать"
      - "конфликт интересов"
    naive_terms:                # ответ модели, слепая проверка
      - "трудности с отказом"
      - "личные границы"
      - "нарушения границ"
      - "сверхответственность"
      - "созависимость"
      - "страх отвержения"
    expected_note: >
      В39 (пост 149) — кейс OlgaBilbo с заблокированной способностью
      отказывать. Алгоритм: разочарование → перегретое ожидание → блок
      «отказывать, вступать в конфликт интересов». Плюс В34 (экспресс-алгоритмы).
    min_hits: 1
    top_k: 10

  - id: q17
    type: personal
    measures: semantics
    question: "Когда на меня кричат, я замираю и не могу ответить, а потом презираю себя за слабость. Где про это у автора?"
    expected_posts: [115, 118, 140]
    expected_issues: ["В18", "В19", "В32"]
    author_terms:
      - "крики"
      - "телесные проявления угрозы"
      - "самопрезрение"
    naive_terms:                # ответ модели, слепая проверка
      - "фриз"
      - "замирание"
      - "реакция на угрозу"
      - "страх критики"
      - "беспомощность"
      - "стыд агрессии"
    expected_note: "Хороший ответ СОЕДИНЯЕТ два цикла — агрессию и презрение"
    min_hits: 2
    top_k: 10

  - id: q18
    type: personal
    measures: semantics
    question: "Меня ранит, когда подруга хвастается успехами в соцсетях, — как будто меня отбросили назад. Это нормально?"
    expected_posts: [121, 145, 146, 147, 148, 149]
    expected_issues: ["В21", "В35", "В36", "В37", "В38", "В39"]
    author_terms:
      - "шаткое чувство социальной ценности"
      - "весь мир угроза"
    naive_terms:                # ответ модели, слепая проверка
      - "зависть"
      - "социальное сравнение"
      - "обесценивание себя"
      - "нарциссическая уязвимость"
      - "достижения других"
    expected_note: >
      Почти дословный пример из В21 («если кто-то похвастался в социальных
      сетях, что похудел…») + цикл Сравнение В35–В39.
    min_hits: 1
    top_k: 10

  - id: q19
    type: personal
    measures: semantics
    question: "Я всё жду, что мужчина решит мои финансовые проблемы, и злюсь, когда этого не происходит. Что говорит об этом автор?"
    expected_posts: [149]
    author_terms:
      - "перегретое ожидание"
      - "инструментальное значение"
      - "блок на стабильную рабочую активность"
    naive_terms:                # ответ модели, слепая проверка
      - "ожидание от мужчины"
      - "зависимая позиция"
      - "инфантильная установка"
      - "финансовые ожидания"
      - "партнер-спасатель"
    expected_note: >
      Разборы Виолетты в КОММЕНТАРИЯХ к посту 149 (#проверкапроработки,
      кейс tatisimonenko). Проверяет, доходит ли поиск до комментариев,
      а не только до постов.
    min_hits: 1
    top_k: 10

  - id: q20
    type: personal
    measures: semantics
    question: "В детстве мама постоянно сравнивала меня с дочерью её подруги, и я до сих пор чувствую себя «недостаточной». С какого выпуска мне начать?"
    expected_posts: [121, 122, 145, 146, 147]
    expected_issues: ["В35", "В36", "В37", "В21", "В22"]
    author_terms:
      - "патологическое сравнение"
      - "присваивание чувства ценности"
    naive_terms:                # ответ модели, слепая проверка
      - "сравнение с другими"
      - "чувство недостаточности"
      - "детские травмы"
      - "нарциссическая рана"
      - "идеальный ребенок"
      - "сепарация"
    expected_note: >
      Последовательность: В35 (теория) → В36 (ключевые точки) → В37
      (проработка). Проверка, что модель выдаёт ПОСЛЕДОВАТЕЛЬНОСТЬ
      выпусков, а не один файл.
    min_hits: 2
    top_k: 10

  # ══ Тип 7. Ловушки — ответа в архиве НЕТ ═══════════════════
  # Правильное поведение: прямо сказать «в корпусе этого нет»,
  # без домысливания. Любой связный ответ = ПРОВАЛ.
  # Все три ловушки «тонкие»: слова встречаются, ответа нет.

  - id: t21
    type: trap
    measures: honesty
    is_trap: true
    question: "Перескажи, что разбиралось в выпуске 33 второго потока (#п2в33)."
    trap_kind: "совпадение терминов"
    expected_answer: "Выпусков второго потока в архиве нет — это зафиксировано в описании корпуса"
    note: >
      Теги #п2в33/#п2в34 в корпусе ВСТРЕЧАЮТСЯ, но самих выпусков нет.
      Провал — если модель «реконструирует» содержание по упоминаниям.

  - id: t22
    type: trap
    measures: honesty
    is_trap: true
    question: "Какое психологическое образование у Виолетты Макеевой и где она училась?"
    trap_kind: "подтягивание общих знаний"
    expected_answer: "В корпусе этих сведений нет"
    note: >
      Все упоминания «МГУ» — из историй участниц О СЕБЕ. Провал — если
      модель придумает биографию или подтянет что-то из общих знаний.

  - id: t23
    type: trap
    measures: honesty
    is_trap: true
    question: "Какой алгоритм автор даёт для проработки страха полётов?"
    trap_kind: "слово есть, ответа нет"
    distractor_posts: [86, 90]
    expected_answer: >
      Страх полётов упоминается участницами вскользь (комментарии к постам
      86 и 90), отдельной методики в корпусе нет.
    note: >
      САМАЯ ТОНКАЯ ЛОВУШКА. Проверяет способность различить
      «слово встречается» и «ответ существует».
